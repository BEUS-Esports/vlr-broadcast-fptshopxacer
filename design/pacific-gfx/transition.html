<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<title>Pacific · Bumper chuyển cảnh</title>
		<link rel="stylesheet" href="pacific.css" />
		<link rel="stylesheet" href="matte.css" />
		<style>
			/* ~4s: cyan + logo khung lime (0–1.3) → navy + chữ dọc (1.3–2.3) → tiêu đề (2.3–4) */
			.l {
				position: absolute;
				inset: 0;
			}
			.c1 {
				background: var(--cyan);
				animation: wipeR 0.4s var(--ease) both;
			}
			.c2 {
				background: #0e2236;
				animation: wipeU 0.4s 1.25s var(--ease) both;
			}
			.c3 {
				animation: wipeR 0.45s 2.2s var(--ease) both;
			}
			.c3 .bg i {
				opacity: 1;
			}
			.side {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 200px;
				display: flex;
				flex-direction: column;
				justify-content: space-around;
				align-items: center;
				font-family: var(--display);
				font-weight: 900;
				font-size: 180px;
				line-height: 0.8;
			}
			.side.l1 {
				left: 40px;
			}
			.side.r1 {
				right: 40px;
			}
			.c1 .side {
				color: #0e2236;
			}
			.c2 .side {
				color: var(--cyan);
			}
			.side span {
				animation: rise 0.4s var(--ease) both;
			}
			.mk {
				position: absolute;
				left: 50%;
				top: 50%;
				width: 260px;
				height: 260px;
				margin: -130px 0 0 -130px;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.mk .brk {
				width: 80px;
				height: 80px;
				border-width: 0;
				border-color: var(--lime);
			}
			.mk .tl {
				border-top-width: 16px;
				border-left-width: 16px;
			}
			.mk .tr {
				border-top-width: 16px;
				border-right-width: 16px;
			}
			.mk .bl {
				border-bottom-width: 16px;
				border-left-width: 16px;
			}
			.mk .br {
				border-bottom-width: 16px;
				border-right-width: 16px;
			}
			.mk b {
				font-family: var(--display);
				font-weight: 900;
				font-size: 140px;
			}
			.c1 .mk {
				animation: pop 0.45s 0.25s var(--ease) both;
			}
			.c1 .mk b {
				color: #0e2236;
			}
			.c2 .mk {
				animation: pop 0.4s 1.45s var(--ease) both;
			}
			.c2 .mk b {
				color: var(--lime);
			}
			.hl {
				position: absolute;
				top: 50%;
				height: 4px;
				width: 460px;
				margin-top: -2px;
				transform-origin: center;
				animation: scaleX 0.5s var(--ease) both;
			}
			.title {
				position: absolute;
				left: 0;
				right: 0;
				top: 50%;
				transform: translateY(-50%);
				text-align: center;
				font-family: var(--display);
				font-weight: 900;
				font-size: 210px;
				line-height: 0.85;
				color: #fff;
				text-shadow: 0 10px 40px #0008;
				animation: blurIn 0.4s 2.5s ease-out both;
			}
			.title small {
				display: block;
				font-size: 120px;
			}
			.arw {
				position: absolute;
				top: 50%;
				margin-top: -40px;
				width: 0;
				height: 0;
				border-top: 40px solid transparent;
				border-bottom: 40px solid transparent;
				animation: fadeIn 0.3s 2.75s both;
			}
			.arw.a {
				left: 330px;
				border-left: 60px solid #fff;
			}
			.arw.b {
				right: 330px;
				border-right: 60px solid #fff;
			}
			.cap {
				position: absolute;
				left: 0;
				right: 0;
				text-align: center;
				font-weight: 800;
				font-size: 20px;
				letter-spacing: 0.4em;
				color: var(--lime);
				animation: fadeIn 0.3s 2.8s both;
			}
		</style>
	</head>
	<body data-anim="css">
		<div class="stage" id="s"></div>
		<script src="data.js"></script>
		<script src="assets/real/real.js"></script>
		<script src="frame.js"></script>
		<script>
			const q = new URLSearchParams(location.search),
				T = (q.get('t') || 'TOP 5|PLAYS').split('|');
			const col = (cls, base) =>
				`<div class="side ${cls}">${['V', 'C', 'T'].map((c, i) => `<span style="${d(base + i * 0.07)}">${c}</span>`).join('')}</div>`;
			const mk = `<div class="mk"><i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i><b>V</b></div>`;
			s.innerHTML = `
    <div class="l c1">${col('l1', 0.15)}${col('r1', 0.15)}<div class="hl" style="left:250px;background:#0e2236;${d(0.4)}"></div><div class="hl" style="right:250px;background:#0e2236;${d(0.4)}"></div>${mk}</div>
    <div class="l c2">${col('l1', 1.35)}${col('r1', 1.35)}<div class="hl" style="left:250px;background:var(--lime);${d(1.5)}"></div><div class="hl" style="right:250px;background:var(--lime);${d(1.5)}"></div>${mk}</div>
    <div class="l c3">${frame(2.4)}<div class="cap" style="top:120px">${GFX.event}</div><div class="arw a"></div><div class="arw b"></div>
      <div class="title">${T[0]}${T[1] ? `<small>${T[1]}</small>` : ''}</div><div class="cap" style="bottom:120px">WEEKLY</div></div>`;
		</script>
		<script src="assets/vendor/gsap.min.js"></script>
		<script src="anim.js"></script>
	</body>
</html>
