<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<title>Pacific · Patch notes</title>
		<link rel="stylesheet" href="pacific.css" />
		<link rel="stylesheet" href="matte.css" />
		<style>
			.t {
				left: 150px;
				top: 110px;
			}
			.wrap {
				left: 150px;
				top: 190px;
				width: 1620px;
			}
			.bar {
				height: 56px;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				font-family: var(--display);
				font-weight: 800;
				font-size: 36px;
				background: var(--cyan);
				color: var(--ink);
			}
			.row {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				margin: 10px 0 18px;
			}
			.ag {
				position: relative;
				height: 300px;
				overflow: hidden;
				background: rgba(20, 52, 72, 0.92);
				padding: 22px 24px;
			}
			.ag img {
				position: absolute;
				right: -30px;
				bottom: -40px;
				height: 380px;
			}
			.ag b {
				position: relative;
				font-family: var(--display);
				font-weight: 800;
				font-size: 46px;
			}
			.ag p {
				position: relative;
				margin: 10px 0 0;
				font-weight: 700;
				font-size: 20px;
				line-height: 1.5;
				max-width: 52%;
			}
			.ag p span {
				color: var(--lime);
			}
			.map {
				position: relative;
				height: 300px;
				overflow: hidden;
			}
			.map img {
				width: 100%;
				height: 100%;
				object-fit: cover;
			}
			.map .lb {
				position: absolute;
				left: 0;
				top: 0;
				right: 0;
				height: 56px;
				background: var(--lime);
				color: var(--ink);
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: var(--display);
				font-weight: 800;
				font-size: 36px;
			}
		</style>
	</head>
	<body>
		<div class="stage" id="s"></div>
		<script src="data.js"></script>
		<script src="assets/real/real.js"></script>
		<script src="frame.js"></script>
		<script>
			const ag = (k, n, lines, i) =>
				`<div class="ag a-wipeR flash" style="${d(0.4 + i * 0.08)}"><img src="assets/agents/full/${k}.png"><b>${n}</b><p>${lines.map((l) => `${l[0]} <span>(${l[1]})</span>`).join('<br>')}</p></div>`;
			s.innerHTML =
				frame() +
				`<div class="abs t a-blur" style="${d(0.1)}"><div class="kick">GAME UPDATE</div><div class="h1" style="font-size:52px;color:var(--lime)">PATCH NOTES 9.08</div></div>
<div class="abs wrap"><div class="bar a-wipeR" style="${d(0.25)}">▲ BUFF</div>
<div class="row">${ag('iso', 'ISO', [['Khiên giảm thời gian hồi', 'E']], 0)}${ag(
					'neon',
					'NEON',
					[
						['Tốc độ chạy', 'C'],
						['Năng lượng', 'E'],
						['Thời gian ult', 'X']
					],
					1
				)}${ag(
					'reyna',
					'REYNA',
					[
						['Hồi máu', 'Q'],
						['Bất tử', 'E'],
						['Thời lượng ult', 'X']
					],
					2
				)}</div>
<div class="bar a-wipeR" style="${d(0.7)}">▼ NERF</div>
<div class="row">${ag('raze', 'RAZE', [['Sát thương lựu đạn', 'Q']], 4)}${ag(
					'clove',
					'CLOVE',
					[
						['Hồi khói', 'C'],
						['Thời gian hồi sinh', 'X']
					],
					5
				)}
<div class="map a-wipeR flash" style="${d(0.96)}"><img src="assets/maps/abyss.png"><div class="lb">ABYSS · NEW MAP</div></div></div></div>`;
		</script>
		<script src="assets/vendor/gsap.min.js"></script>
		<script src="anim.js"></script>
	</body>
</html>
