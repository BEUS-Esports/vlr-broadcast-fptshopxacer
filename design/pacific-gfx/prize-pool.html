<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<title>Pacific · Prize pool</title>
		<link rel="stylesheet" href="pacific.css" />
		<link rel="stylesheet" href="matte.css" />
		<style>
			.t {
				left: 190px;
				top: 150px;
			}
			.list {
				left: 190px;
				top: 300px;
				width: 930px;
			}
			.row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				height: 96px;
				margin-bottom: 10px;
				padding: 0 34px;
				font-family: var(--display);
				font-weight: 800;
				font-size: 52px;
				background: rgba(22, 48, 86, 0.95);
			}
			.row:first-child {
				background: var(--cyan);
				color: var(--ink);
			}
			.tot {
				left: 1180px;
				top: 340px;
				width: 500px;
				height: 520px;
				background: rgba(58, 215, 220, 0.85);
				color: var(--ink);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
			}
			.tot small {
				font-weight: 800;
				font-size: 34px;
				letter-spacing: 0.04em;
			}
			.tot b {
				font-family: var(--display);
				font-weight: 900;
				font-size: 110px;
				line-height: 1;
			}
			.tot .logo {
				width: 150px;
				height: 150px;
				border: 12px solid var(--ink);
				border-radius: 50%;
				border-right-color: transparent;
				margin-bottom: 24px;
			}
			.tot .brk {
				width: 56px;
				height: 56px;
			}
		</style>
	</head>
	<body>
		<div class="stage" id="s"></div>
		<script src="data.js"></script>
		<script src="assets/real/real.js"></script>
		<script src="frame.js"></script>
		<script>
			const P = [
				['1st', '$100,000'],
				['2nd', '$65,000'],
				['3rd', '$40,000'],
				['4th', '$25,000'],
				['5th', '$10,000'],
				['6th', '$10,000']
			];
			s.innerHTML =
				frame() +
				`<div class="abs t a-blur" style="${d(0.1)}"><div class="kick">SEASON PLAYOFFS</div><div class="h1" style="font-size:80px">PRIZE POOL</div></div>
<div class="abs list">${P.map((p, i) => `<div class="row a-wipeR flash" style="${d(0.35 + i * 0.08)}"><span>${p[0]}</span><span>${p[1]}</span></div>`).join('')}</div>
<div class="abs tot a-wipeU flash" style="${d(0.95)}"><div class="mark-v"><i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i>V</div><small>TOTAL PRIZE</small><b>$250,000</b><i class="brk tl" style="left:-16px;top:-16px"></i><i class="brk br" style="right:-16px;bottom:-16px"></i></div>`;
		</script>
		<script src="assets/vendor/gsap.min.js"></script>
		<script src="anim.js"></script>
	</body>
</html>
